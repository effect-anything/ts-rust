[workspace]
members = [
    "crates/ts_goport",
    "crates/ts_goport/parts/goport_core",
    "crates/ts_goport/parts/goport_lsproto",
    "crates/ts_goport/parts/goport_util",
    "crates/ts_ext_syntax",
    "crates/ts_ext_typegpu",
    "crates/ts_ext_sweetener",
    "crates/ts_wasm",
    "tools/ts_ast_codegen",
    "tools/ts_diagnostics_codegen",
]
resolver = "3"

[workspace.package]
version = "7.0.0-dev"
edition = "2024"
license = "MIT AND Apache-2.0"
repository = "https://github.com/microsoft/typescript-go"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"

# Release profile for the goport binaries: `cargo build --profile goport`.
# Binaries land in <target>/goport/. Other crates keep the default release
# settings, and the test and dev profiles (used by the regression) do not
# inherit this.
[profile.goport]
inherits = "release"
lto = "fat"
codegen-units = 1

# Profile for the shipped tsc-ext bin and its Node addon (tsc-ext.node):
# `cargo build --profile ext -p ts_ext_syntax --bin tsc-ext --lib`.
# Fat LTO with one codegen unit and stripped symbols. On darwin-arm64,
# against the release profile: tsc-ext 29.4 -> 22.2 MB, tsc-ext.node
# 28.5 -> 23.0 MB, startup about 12% faster, transform time the same.
[profile.ext]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Size profile for the wasm build (crates/ts_wasm, scripts/wasm/build.sh):
# `cargo build --profile wasm --target wasm32-wasip1`. wasm cannot unwind,
# so panics abort. Panic messages stay.
# opt-level "z" is the smallest: 4.2 MB, where "s" with a lower inline
# limit is 5.2 MB and checks 13 to 18% faster (scripts/wasm/build.sh tells how
# to build that one).
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
