[package]
name = "ext_syntax_node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Node-API for ext-syntax. Generates index.d.ts."

[lib]
crate-type = ["cdylib"]

[dependencies]
ts_ext_syntax = { path = "../ts_ext_syntax" }
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[lints.rust]
unsafe_code = "allow"
